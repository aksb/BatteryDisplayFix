name: Build APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]      # push 一个 v1.0 这样的 tag 会额外触发下面的 release 任务
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform & build-tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.6

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatteryDisplayFix-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  # 只有推送的是 v 开头的 tag（比如 v1.0）才会跑这个任务，
  # 普通分支 push 只会触发上面的 build，不会创建 Release。
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 Release 需要这个写权限
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: BatteryDisplayFix-debug-apk
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
